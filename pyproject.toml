[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "canopee-sdk"
version = "0.1.0"
description = "Python client SDK for a Canopee node's Unix socket: identity, storage, user records, devices, pairing, DHT, pub/sub and capabilities."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Canopee Network" }]
keywords = ["canopee", "sdk", "p2p", "storage"]
classifiers = [
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries",
]

[tool.setuptools.packages.find]
include = ["canopee_sdk*"]

[tool.pytest.ini_options]
pythonpath = ["."]

[project.urls]
Homepage = "https://github.com/Canopee-network/canopee-sdk-python"